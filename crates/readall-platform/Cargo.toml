[package]
name = "readall-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
wayland = ["dep:xkbcommon", "dep:url"]

[dependencies]
readall-core.workspace = true
readall-render.workspace = true
xkbcommon = { version = "=0.9.0", optional = true, default-features = false }
url = { version = "=2.5.8", optional = true }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
