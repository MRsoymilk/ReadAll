[workspace]
members = ["crates/readall-archive", "crates/readall-core", "crates/readall-epub", "crates/readall-font", "crates/readall-image", "crates/readall-mobi", "crates/readall-render", "crates/readall-platform", "crates/readall-android", "apps/readall"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
readall-archive = { path = "crates/readall-archive" }
readall-epub = { path = "crates/readall-epub" }
readall-font = { path = "crates/readall-font" }
readall-core = { path = "crates/readall-core" }
readall-render = { path = "crates/readall-render" }
readall-image = { path = "crates/readall-image" }
readall-mobi = { path = "crates/readall-mobi" }
readall-platform = { path = "crates/readall-platform" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Keep ordinary releases within modest build-memory budgets. Cross-crate LTO
# remains opt-in; the reader still uses opt-level=3 in both release profiles.
[profile.release]
lto = false
codegen-units = 16

[profile.release-lto]
inherits = "release"
lto = "thin"
codegen-units = 1
