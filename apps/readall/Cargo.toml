[package]
name = "readall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = ["wayland"]
# Platform-neutral worker API; does not enable Wayland, XKB or desktop clipboard.
mobile = []
wayland = ["readall-platform/wayland", "dep:wl-clipboard-rs"]

[build-dependencies]
readall-font.workspace = true

[dependencies]
readall-epub.workspace = true
readall-mobi.workspace = true
readall-font.workspace = true
readall-core.workspace = true
readall-render.workspace = true
readall-image.workspace = true
readall-platform.workspace = true
rustybuzz = "=0.20.1"
unicode-bidi = "=0.3.18"
unicode-script = "=0.5.8"
wl-clipboard-rs = { version = "=0.9.3", optional = true }

[lints]
workspace = true
